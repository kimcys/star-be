name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default: nothing here needs to write to the repo,
# push packages, or comment on anything.
permissions:
  contents: read

jobs:
  test:
    name: Test (PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2.34.0
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql
          tools: composer
      - run: composer install --prefer-dist --no-progress
      - name: Dependency vulnerability scan
        run: composer audit
      - run: vendor/bin/phpunit --testdox

  docker:
    name: Build & scan image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - run: docker build -t star-be:${{ github.sha }} .
      - name: Scan image for known-fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: star-be:${{ github.sha }}
          severity: CRITICAL
          # Failing the build over a CVE with no available fix yet
          # (i.e. only the upstream maintainer can act) just blocks
          # merges without anyone being able to do anything about it -
          # so this only gates on the ones a `docker build` today can
          # actually resolve.
          ignore-unfixed: true
          exit-code: '1'
