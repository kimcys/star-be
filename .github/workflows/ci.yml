name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default: nothing here needs to write to the repo,
# push packages, or comment on anything.
permissions:
  contents: read

jobs:
  test:
    name: Test (PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2.34.0
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql
          tools: composer
      - run: composer install --prefer-dist --no-progress
      - name: Dependency vulnerability scan
        run: composer audit
      - run: vendor/bin/phpunit --testdox

  docker:
    name: Build & scan image
    runs-on: ubuntu-latest
    # Only this job needs to publish a package, and only for the one step
    # below that's actually gated to real pushes to main - everything else
    # in this workflow stays read-only.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - run: docker build -t star-be:${{ github.sha }} .
      - name: Scan image for known-fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: star-be:${{ github.sha }}
          severity: CRITICAL
          # Failing the build over a CVE with no available fix yet
          # (i.e. only the upstream maintainer can act) just blocks
          # merges without anyone being able to do anything about it -
          # so this only gates on the ones a `docker build` today can
          # actually resolve.
          ignore-unfixed: true
          exit-code: '1'

      # Only publish images built from a real, scanned commit on main -
      # never from a pull request (which could come from a fork with no
      # write access) and never from a branch that hasn't passed the scan
      # above yet, since this step only runs after it.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker tag star-be:${{ github.sha }} ghcr.io/kimcys/star-be:${{ github.sha }}
          docker tag star-be:${{ github.sha }} ghcr.io/kimcys/star-be:latest
          docker push ghcr.io/kimcys/star-be:${{ github.sha }}
          docker push ghcr.io/kimcys/star-be:latest

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    permissions:
      contents: read
    steps:
      # git pull picks up any change to deploy/ (Caddyfile, compose file)
      # committed since the server's last deploy; docker compose pull only
      # re-downloads the backend image if ghcr.io actually has a newer
      # digest for :latest, so this is a no-op most of the time on that
      # front.
      - name: Deploy backend to the droplet
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: aimanhakimcy.com
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /root/star-media
            git pull --ff-only origin main
            git submodule update --init --recursive
            cd deploy
            docker compose -f docker-compose.production.yml --env-file .env.production pull backend
            docker compose -f docker-compose.production.yml --env-file .env.production up -d backend
            docker image prune -f

      # Checked from inside the droplet - the Cloud Firewall only allows
      # 80/443/22 in, so the backend's own container port was never meant
      # to be reachable directly from outside.
      - name: Confirm the API is actually up
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: aimanhakimcy.com
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            for i in $(seq 1 10); do
              if docker exec deploy-backend-1 php bin/healthcheck.php; then exit 0; fi
              sleep 3
            done
            echo "API did not report healthy after deploy" >&2
            exit 1
